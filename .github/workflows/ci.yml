name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rodar testes
        env:
          SECRET_KEY: chave-de-teste-usada-apenas-no-ci
        run: pytest -v

      - name: Verificar se a aplicação inicia
        env:
          SECRET_KEY: chave-de-teste-usada-apenas-no-ci
        run: |
          python -c "import app.main; print('Aplicação carregada com sucesso!')"
