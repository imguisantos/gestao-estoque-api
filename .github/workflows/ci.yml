name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Rodar testes
        run: pytest -v
        env:
          SECRET_KEY: chave-de-teste-usada-apenas-no-ci

      - name: Verificar se a aplicacao importa sem erro
        run: python -c "import app.main; print('ok')"
        env:
          SECRET_KEY: chave-de-teste-usada-apenas-no-ci
